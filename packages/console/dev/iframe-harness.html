<!DOCTYPE html>
<!-- 创空间裁剪仿真试验台:模拟 ModelScope 包装页 min-width:1280 + iframe 1276px -->
<html><head><meta charset="utf-8"><title>iframe-crop-harness</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { min-width: 1280px; background: #333; }
  .wrap { width: 1280px; margin: 0 auto; background: #fff; }
  iframe { width: 1276px; height: 90vh; border: 0; display: block; margin: 0 auto; }
</style></head>
<body>
  <div class="wrap">
    <iframe id="app" src="http://127.0.0.1:3200/console"></iframe>
  </div>
</body></html>
